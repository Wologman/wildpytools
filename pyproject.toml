[project]
name = "wiltpytools"        # pip install wildlife-tools
version = "0.1.0"
description = "Python tools for ecology research"
readme = "README.md"
authors = [
  { name = "Olly Powell", email = "olly@wekaresearch.com" }
]
dependencies = [
  "librosa",
  "pydub==0.25.1",
  "numpy < 2",
  "pandas",
  "tqdm",
  "ipython",
  "jupyter",
  "matplotlib",
  "plotly",
  "plotly_express",
  "scipy",
  "scikit-learn",
  "scikit-image",
  "seaborn",
  "opencv",
  "python-kaleido",
  "fastparquet",
  "pyarrow",
  "piexif",
  "pyyaml",
  "pysoundfile",
  "pyproj",
  "geopandas",
  "contextily",
  "mutagen",
]
requires-python = ">=3.9"